name: Update data
on:
  schedule:
    - cron: "30 1 * * *"   # 07:00 IST
    - cron: "30 13 * * *"  # 19:00 IST
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline tests
        run: python tests/test_fetch.py
      - name: Fetch PIB releases
        run: python scripts/fetch_pib.py
      - name: Commit new data
        run: |
          git config user.name "ca-daily-bot"
          git config user.email "ca-daily-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "No new data" && exit 0
          git commit -m "data: update PIB releases"
          git push
